<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Datos REST y visualización: dos recorridos</title><desc id="desc">Integración de Indicadores de Presidencia. Elaboración: Marcelo Chávez.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0L10 4L0 8Z" fill="#008A99"/></marker></defs><text x="32" y="42" font-family="Arial, sans-serif" font-size="28" fill="#003872" text-anchor="start" font-weight="700">Datos REST y visualización: dos recorridos</text><text x="32" y="102" font-family="Arial, sans-serif" font-size="22" fill="#003872" text-anchor="start" font-weight="700">DATOS REST · corte agregado</text><rect x="32" y="132" width="248" height="124" rx="6" fill="white" stroke="#B8CEDC" stroke-width="2"/><text x="52" y="168" font-family="Arial, sans-serif" font-size="24" fill="#003872" text-anchor="start" font-weight="700">PostgreSQL</text><text x="52" y="232" font-family="Arial, sans-serif" font-size="19" fill="#52677A" text-anchor="start">Consultas institucionales</text><rect x="324" y="132" width="248" height="124" rx="6" fill="white" stroke="#B8CEDC" stroke-width="2"/><text x="344" y="168" font-family="Arial, sans-serif" font-size="24" fill="#003872" text-anchor="start" font-weight="700">Exportador R</text><text x="344" y="232" font-family="Arial, sans-serif" font-size="19" fill="#52677A" text-anchor="start">exportar.R / bootstrap.R</text><rect x="616" y="132" width="248" height="124" rx="6" fill="white" stroke="#B8CEDC" stroke-width="2"/><text x="636" y="168" font-family="Arial, sans-serif" font-size="24" fill="#003872" text-anchor="start" font-weight="700">Corte JSON</text><text x="636" y="232" font-family="Arial, sans-serif" font-size="19" fill="#52677A" text-anchor="start">Refresco horario</text><rect x="908" y="132" width="260" height="124" rx="6" fill="white" stroke="#008A99" stroke-width="3"/><text x="928" y="168" font-family="Arial, sans-serif" font-size="24" fill="#003872" text-anchor="start" font-weight="700">FastAPI</text><text x="928" y="232" font-family="Arial, sans-serif" font-size="19" fill="#52677A" text-anchor="start">GET de series</text><path d="M280 194 H324" fill="none" stroke="#008A99" stroke-width="2" marker-end="url(#arrow)"/><path d="M572 194 H616" fill="none" stroke="#008A99" stroke-width="2" marker-end="url(#arrow)"/><path d="M864 194 H908" fill="none" stroke="#008A99" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="346" font-family="Arial, sans-serif" font-size="22" fill="#003872" text-anchor="start" font-weight="700">VISUALIZACIÓN · HTML y WebSocket</text><rect x="32" y="376" width="248" height="124" rx="6" fill="white" stroke="#B8CEDC" stroke-width="2"/><text x="52" y="412" font-family="Arial, sans-serif" font-size="24" fill="#003872" text-anchor="start" font-weight="700">Sistema externo</text><text x="52" y="476" font-family="Arial, sans-serif" font-size="19" fill="#52677A" text-anchor="start">Backend + navegador</text><rect x="324" y="376" width="248" height="124" rx="6" fill="white" stroke="#B8CEDC" stroke-width="2"/><text x="344" y="412" font-family="Arial, sans-serif" font-size="24" fill="#003872" text-anchor="start" font-weight="700">HTTPS / Nginx</text><text x="344" y="476" font-family="Arial, sans-serif" font-size="19" fill="#52677A" text-anchor="start">Público 443 / interno 8595</text><rect x="616" y="376" width="248" height="124" rx="6" fill="white" stroke="#008A99" stroke-width="3"/><text x="636" y="412" font-family="Arial, sans-serif" font-size="24" fill="#003872" text-anchor="start" font-weight="700">FastAPI</text><text x="636" y="476" font-family="Arial, sans-serif" font-size="19" fill="#52677A" text-anchor="start">127.0.0.1:8000</text><rect x="908" y="376" width="260" height="124" rx="6" fill="white" stroke="#B8CEDC" stroke-width="2"/><text x="928" y="412" font-family="Arial, sans-serif" font-size="24" fill="#003872" text-anchor="start" font-weight="700">Adaptador Shiny</text><text x="928" y="476" font-family="Arial, sans-serif" font-size="19" fill="#52677A" text-anchor="start">127.0.0.1:8001</text><path d="M280 438 H324" fill="none" stroke="#008A99" stroke-width="2" marker-end="url(#arrow)"/><path d="M572 438 H616" fill="none" stroke="#008A99" stroke-width="2" marker-end="url(#arrow)"/><path d="M864 438 H908" fill="none" stroke="#008A99" stroke-width="2" marker-end="url(#arrow)"/><text x="32" y="558" font-family="Arial, sans-serif" font-size="21" fill="#52677A" text-anchor="start">Ambos recorridos utilizan el mismo servicio FastAPI del 197.</text><text x="32" y="590" font-family="Arial, sans-serif" font-size="21" fill="#52677A" text-anchor="start">El adaptador reutiliza la UI, el server y las consultas originales de Presidencia.</text><text x="32" y="644" font-family="Arial, sans-serif" font-size="19" fill="#52677A" text-anchor="start">Fuente: Sistema de Visualización Analítica en Salud (SIVAS).</text><text x="32" y="669" font-family="Arial, sans-serif" font-size="19" fill="#52677A" text-anchor="start">Elaboración: Marcelo Chávez.</text></svg>